version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: techbrief
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      - postgres
      - redis
    ports:
      - '4000:4000'

  rss-poller:
    build: ./backend
    env_file: ./backend/.env
    command: npm run rss:poll
    depends_on:
      - postgres
      - redis

  ai-processor:
    build: ./backend
    env_file: ./backend/.env
    command: npm run ai:process
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
