version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: techbrief
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - postgres
      - redis
      - ollama
    ports:
      - '4000:4000'

  rss-poller:
    build: ./backend
    env_file: ./backend/.env
    command: npm run rss:poll
    depends_on:
      - postgres
      - redis

  ai-processor:
    build: ./backend
    env_file: ./backend/.env
    environment:
      OLLAMA_URL: http://ollama:11434
    command: npm run ai:process
    depends_on:
      - postgres
      - redis
      - ollama

  techbrief:
    build: ./apps/techbrief
    env_file: ./apps/techbrief/.env.local
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  ollama_data:
