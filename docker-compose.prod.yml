version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - postgres
      - redis
      - ollama
    ports:
      - '4000:4000'

  rss-poller:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    command: npm run rss:poll
    depends_on:
      - postgres
      - redis

  ai-processor:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      OLLAMA_URL: http://ollama:11434
    command: npm run ai:process
    depends_on:
      - postgres
      - redis
      - ollama

volumes:
  postgres_data:
  ollama_data:
